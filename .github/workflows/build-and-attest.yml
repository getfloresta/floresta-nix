# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Builds every distro of one release on the hosts below, records GitHub
# build provenance for them, and publishes them to a GitHub Release. The
# release is the dispatch input, or the pushed tag without its `v`
# (v0.9.1 -> 0.9.1): the packages built are packages.<host>.*-v0_9_1.
#
# Artifact names match what the attestation manifest uses, so the published
# SHA256SUMS can be compared line for line against the attestations in
# contrib/sigs/: `<file>-<triple>`, the triple read off each package's
# rustTarget, as lib/attestation.nix does.
#
# One host per distro: two copies of one artifact cannot both be published.
# Both Linux hosts list x86_64-linux-static (commented out for now); only
# one of them may build it here once it is enabled.

name: Build and Attest

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Floresta release to build, as lib/targets.nix names it (e.g. 0.9.1)"
        required: true

permissions:
  contents: read

env:
  RELEASE: ${{ inputs.release || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: x86_64-linux
          - runner: ubuntu-24.04-arm
            host: aarch64-linux
          - runner: macos-14
            host: aarch64-darwin

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: floresta-flake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build and collect ${{ env.RELEASE }} on ${{ matrix.host }}
        run: |
          set -euo pipefail
          release="${RELEASE#v}"
          suffix="-v${release//./_}"
          root=".#packages.${{ matrix.host }}"
          mkdir -p results

          packages=$(nix eval --raw "$root" --apply 'ps: toString (builtins.attrNames ps)')
          found=0
          for pkg in $packages; do
            [[ "$pkg" == *"$suffix" ]] || continue
            echo "::group::nix build $root.$pkg"
            out=$(nix build -L --no-link --print-out-paths "$root.$pkg")
            echo "::endgroup::"
            triple=$(nix eval --raw "$root.$pkg.rustTarget")

            # Which files a distro publishes is read off the result,
            # matching what lib/attestation.nix hashes.
            for dir in bin lib; do
              [ -d "${out}/${dir}" ] || continue
              for artifact in "${out}/${dir}"/*; do
                [ -f "${artifact}" ] || continue
                cp -L "${artifact}" "results/$(basename "${artifact}")-${triple}"
                found=$((found + 1))
              done
            done
          done
          [ "${found}" -gt 0 ] || { echo "error: no package of ${{ matrix.host }} ends in ${suffix}" >&2; exit 1; }
          chmod -R u+w results
          ls -l results

      - name: Upload ${{ matrix.host }}
        uses: actions/upload-artifact@v7
        with:
          name: floresta-${{ matrix.host }}
          path: results/*
          if-no-files-found: error

  attest-and-release:
    name: Attest and Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: results
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd results
          sha256sum -- * | LC_ALL=C sort -k2 > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            results/*
            !results/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: results/*
