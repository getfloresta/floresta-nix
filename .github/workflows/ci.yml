name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["contrib/sigs/**"]
  pull_request:
    branches: [master]
    # Attestation PRs add signed manifests and nothing else; rebuilding the
    # whole matrix to review two text files is pure waste.
    paths-ignore: ["contrib/sigs/**"]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  nix-sanity-check:
    name: Nix Sanity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: floresta-flake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Nix flake check
        run: nix flake check -L

      - name: Verify consumer integration
        run: nix flake check ./examples -L --no-build

  service-tests:
    name: Service Module Tests
    needs: nix-sanity-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: floresta-flake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Run eval tests
        run: nix build -L .#checks.x86_64-linux.service-eval-test

      - name: Run VM integration test
        run: nix build -L .#checks.x86_64-linux.service-vm-test

  # Every package of every host: each (release, distro) pair lib/targets.nix
  # lists. Read off the flake, so a host, distro or release added there is
  # built here with no edit to this file — beyond a runner for a new host.
  matrix:
    name: Distro matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.eval.outputs.include }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Evaluate the packages of every host
        id: eval
        run: |
          include=$(nix eval --json .#packages --apply '
            packages:
            let
              runners = {
                x86_64-linux = "ubuntu-latest";
                aarch64-linux = "ubuntu-24.04-arm";
                aarch64-darwin = "macos-14";
              };
            in
            builtins.concatLists (builtins.attrValues (builtins.mapAttrs (host: ps:
              map (package: {
                inherit host package;
                runner = runners.${host};
                attr = "packages.${host}.${package}";
              }) (builtins.attrNames ps)
            ) packages))
          ')
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.package }} (${{ matrix.host }})
    needs: [nix-sanity-check, matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    steps:
      # The Android NDK alone is several GB.
      - name: Free disk space
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo docker image prune --all --force

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: floresta-flake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build ${{ matrix.package }}
        run: nix build -L '.#${{ matrix.attr }}'
